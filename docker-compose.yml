# MoveON no VPS.
#
# Usando Supabase: apague o serviço "banco" e aponte DATABASE_URL/DIRECT_URL
# do .env para a connection string do projeto.
#
#   docker compose up -d --build
#   docker compose exec site npx prisma migrate deploy
#   docker compose exec site npx tsx prisma/seed.ts

services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moveon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
      POSTGRES_DB: moveon
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveon -d moveon"]
      interval: 10s
      timeout: 5s
      retries: 5

  site:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://moveon:troque-esta-senha@banco:5432/moveon}
      DIRECT_URL: ${DIRECT_URL:-postgresql://moveon:troque-esta-senha@banco:5432/moveon}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO:?defina SESSAO_SEGREDO no .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS:-}
    ports:
      - "3000:3000"

volumes:
  dados-postgres:
